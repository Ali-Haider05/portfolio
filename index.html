<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Syed Ali Haider — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0f1624;
      --bg2:#131d2e;
      --surface:#1a2540;
      --border:#243050;
      --blue:#c9a84c;
      --text:#f0ede6;
      --muted:#9aa3b8;
      --mono:'Space Mono',monospace;
      --sans:'Poppins',sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;}
    /* Nav & Hero Styles same as before */
    nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:1rem 6%;background:rgba(15, 22, 36, 0.95);border-bottom:1px solid var(--border);}
    .nav-logo{font-family:var(--mono);font-size:1rem;color:var(--blue);font-weight:700;}
    .nav-links{display:flex;gap:2.5rem;list-style:none;}
    .nav-links a{font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;}
    
    #hero{padding:8rem 6% 5rem;text-align:center;}
    .pic-outer{width:250px;height:250px;margin:0 auto 2rem;border-radius:50%;border:4px solid var(--blue);overflow:hidden;}
    .pic-outer img{width:100%;height:100%;object-fit:cover;}
    
    section.sec{padding:5rem 6%;}
    .sec-ttl{font-size:2rem;margin-bottom:2rem;text-align:center;}
    .pj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem;}
    .pj-card{background:var(--surface);padding:2rem;border-radius:12px;border:1px solid var(--border);}
    .pj-link{color:var(--blue);text-decoration:none;font-weight:bold;}
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">Ali.dev</div>
  <ul class="nav-links">
    <li><a href="#projects">Projects</a></li>
  </ul>
</nav>

<section id="hero">
  <div class="pic-outer">
    <img id="pImg" src="ALi.jpeg" alt="Syed Ali Haider"/>
  </div>
  <h1>Syed Ali Haider</h1>
  <p>Aspiring AI / ML Engineer</p>
</section>

<section class="sec" id="projects">
  <h2 class="sec-ttl">My <span>Projects</span></h2>
  <div class="pj-grid">
    <div class="pj-card">
      <h3>ToolZap Platform</h3>
      <p>Privacy-focused web utilities for file processing.</p>
      <a href="https://toolzap.me" target="_blank" class="pj-link">Live Site &rarr;</a>
    </div>
    <div class="pj-card">
      <h3>Java Projects</h3>
      <p>Student Management System & Bookstore.</p>
      <a href="https://github.com/Ali-Haider05" target="_blank" class="pj-link">GitHub &rarr;</a>
    </div>
  </div>
</section>

</body>
</html>
